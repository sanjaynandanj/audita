[project]
name = "audita"
version = "0.1.0"
description = "Audita - GST ITC recon agent, the first agent of an agentic audit platform. Ingests GSTR-2B + purchase register + invoice scans, produces a CA-reviewed 'ITC at risk' report."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
vision = ["google-genai>=1.0"]
agents = ["google-adk>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108"]  # B008: FastAPI Depends/Form defaults; SIM108: ternary preference
