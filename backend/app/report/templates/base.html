<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Audita{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1220;
    --ink-2: #334155;
    --sub: #64748b;
    --line: #e2e8f0;
    --bg: #f6f7fb;
    --surface: #ffffff;
    --accent: #4f46e5;
    --accent-2: #6366f1;
    --risk: #dc2626;
    --risk-bg: #fef2f2;
    --ok: #059669;
    --ok-bg: #ecfdf5;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 24px -12px rgba(15,23,42,.12);
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--bg); margin: 0; font-size: 15px; line-height: 1.55;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; }

  /* ---- top nav ---- */
  nav.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; background: #0b1220; color: #fff;
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; color: #fff; text-decoration: none; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, #818cf8, #4f46e5); box-shadow: 0 0 12px rgba(99,102,241,.8); }
  .brand small { font-weight: 500; font-size: 12px; color: #94a3b8; margin-left: 4px; }
  nav.top .right { display: flex; gap: 10px; align-items: center; font-size: 13px; color: #94a3b8; }
  .pill { border: 1px solid #1f2a44; background: #111a2e; color: #a5b4fc; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 28px 90px; }

  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 6px; }
  h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin: 40px 0 14px; display: flex; align-items: center; gap: 10px; }
  h2 .count { font-size: 12px; font-weight: 700; color: var(--sub); background: #eef2f7; padding: 2px 10px; border-radius: 999px; }
  .sub { color: var(--sub); font-size: 14px; }

  /* ---- cards ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin: 26px 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: transparent; }
  .card.hero-risk::before { background: linear-gradient(90deg, #ef4444, #b91c1c); }
  .card.hero-warn::before { background: linear-gradient(90deg, #f59e0b, #d97706); }
  .card.hero-ok::before { background: linear-gradient(90deg, #34d399, #059669); }
  .card.hero-neutral::before { background: linear-gradient(90deg, #818cf8, #4f46e5); }
  .card .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--sub); }
  .card .value { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .card .hint { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .risk { color: var(--risk); } .ok { color: var(--ok); } .warn { color: var(--warn); }

  /* ---- tables ---- */
  .tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f8fafc; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafbff; }
  td .amount { font-weight: 700; font-variant-numeric: tabular-nums; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .badge.pending { background: var(--warn-bg); color: #92400e; }
  .badge.verified { background: var(--ok-bg); color: #065f46; }
  .badge.bucket { background: #eef2ff; color: #3730a3; font-weight: 600; }

  /* ---- forms & buttons ---- */
  input, button { font: inherit; }
  input[type=text] {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; background: #fff;
    transition: border-color .15s, box-shadow .15s; width: 100%;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff;
    border: 0; border-radius: 10px; padding: 11px 22px; font-weight: 700; font-size: 14px;
    cursor: pointer; box-shadow: 0 4px 14px -4px rgba(79,70,229,.5); transition: transform .1s, box-shadow .15s;
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(79,70,229,.55); }
  .btn.ghost { background: #fff; color: var(--ink-2); border: 1px solid var(--line); box-shadow: none; }
  .btn.ghost:hover { border-color: #cbd5e1; }
  .btn.sm { padding: 7px 14px; font-size: 12.5px; border-radius: 8px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 600; margin-bottom: 7px; font-size: 13.5px; }

  .note {
    background: linear-gradient(180deg, #eef2ff, #e0e7ff55); border: 1px solid #c7d2fe;
    padding: 14px 18px; border-radius: 12px; font-size: 13px; color: #3730a3;
  }
  a { color: var(--accent); }
  details summary { cursor: pointer; font-weight: 700; font-size: 15px; margin: 36px 0 14px; }

  /* progress bar */
  .progress { height: 8px; border-radius: 999px; background: #fde68a55; border: 1px solid #fcd34d; overflow: hidden; margin: 6px 0 2px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #34d399, #059669); border-radius: 999px; transition: width .6s ease; }

  @media print {
    nav.top, .no-print { display: none !important; }
    body { background: #fff; }
    .card, .tablewrap { box-shadow: none; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="top">
  <a class="brand" href="/"><span class="dot"></span>audita <small>GST ITC recon</small></a>
  <div class="right no-print">
    <span class="pill">CA-reviewed</span>
    <span class="pill">Append-only audit trail</span>
  </div>
</nav>
<div class="wrap">{% block content %}{% endblock %}</div>
<script>
  // Count-up animation for elements with data-countup="123.45"
  document.querySelectorAll("[data-countup]").forEach(el => {
    const target = parseFloat(el.dataset.countup || "0");
    if (!isFinite(target) || target === 0) { el.textContent = "₹0"; return; }
    const dur = 900, t0 = performance.now();
    const fmt = n => "₹" + n.toLocaleString("en-IN", {maximumFractionDigits: 0});
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * eased);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
